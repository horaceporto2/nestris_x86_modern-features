name: Publish v0.8.1 release

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/release-v0.8.1.yml

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libpng-dev libsdl1.2-dev libsdl-mixer1.2-dev libyaml-cpp-dev libgl1-mesa-dev libx11-dev patchelf
      - name: Build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target nestris_x86 --parallel 2
      - name: Package
        run: |
          mkdir -p dist/nestris_x86-linux-x86_64/lib dist/nestris_x86-linux-x86_64/THIRD-PARTY-LICENSES
          cp build/nestris_x86 README.md LICENSE dist/nestris_x86-linux-x86_64/
          cp -L /usr/lib/x86_64-linux-gnu/libyaml-cpp.so.0.7 dist/nestris_x86-linux-x86_64/lib/libyaml-cpp.so.0.7
          cp /usr/share/doc/libyaml-cpp0.7/copyright dist/nestris_x86-linux-x86_64/THIRD-PARTY-LICENSES/yaml-cpp-copyright
          patchelf --set-rpath '$ORIGIN/lib' dist/nestris_x86-linux-x86_64/nestris_x86
          printf '%s\n' 'Linux x86_64 build. The yaml-cpp runtime library is bundled.' 'Requires SDL 1.2, SDL_mixer, OpenGL, and standard system libraries.' 'Run ./nestris_x86 from this directory. If prompted, choose Run or Allow Launch.' > dist/nestris_x86-linux-x86_64/INSTALL.txt
          ldd dist/nestris_x86-linux-x86_64/nestris_x86 | tee dist/nestris_x86-linux-x86_64/DEPENDENCIES.txt
          if grep -q 'not found' dist/nestris_x86-linux-x86_64/DEPENDENCIES.txt; then exit 1; fi
          tar -C dist -cJf dist/nestris_x86_linux_x86-64.tar.xz nestris_x86-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: dist/nestris_x86_linux_x86-64.tar.xz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Windows dependencies
        run: vcpkg install yaml-cpp:x64-windows
      - name: Configure
        shell: pwsh
        run: |
          $toolchain = Join-Path $env:VCPKG_INSTALLATION_ROOT 'scripts/buildsystems/vcpkg.cmake'
          cmake -S . -B build -A x64 "-DCMAKE_POLICY_VERSION_MINIMUM=3.5" "-DCMAKE_TOOLCHAIN_FILE=$toolchain" -DVCPKG_TARGET_TRIPLET=x64-windows
      - name: Build
        run: cmake --build build --config Release --target nestris_x86 --parallel
      - name: Package
        shell: pwsh
        run: |
          $package = 'dist/nestris_x86-windows-x86_64'
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item 'build/Release/nestris_x86.exe' $package
          Copy-Item 'SDL-win32/lib/SDL.dll' $package
          Copy-Item 'SDL-win32/lib/SDL_mixer.dll' $package
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/yaml-cpp.dll" $package
          Copy-Item 'README.md' $package
          Copy-Item 'LICENSE' $package
          Compress-Archive -Path "$package/*" -DestinationPath 'dist/nestris_x86_win_x86-64.zip' -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/nestris_x86_win_x86-64.zip

  publish:
    if: "startsWith(github.event.head_commit.message, 'release: publish v0.8.1')"
    needs:
      - build-linux
      - build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v0.8.1 dist/nestris_x86_linux_x86-64.tar.xz dist/nestris_x86_win_x86-64.zip --target "$GITHUB_SHA" --title "Nestris x86 v0.8.1" --notes "Linux launch fix: bundle yaml-cpp 0.7 and set the executable runtime path to the bundled library. Includes Linux x86_64 and Windows x86_64 builds. The original project is by Ross Kidson (https://github.com/rosskidson/nestris_x86)."
